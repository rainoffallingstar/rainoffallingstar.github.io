        <h3>实验文本一至十一</h3>
        <p>在高中时候开始读史书。</p>
        <p>后来在某次与袁夫子书内妙手偶得一篇，始得谢夫子所识，乃命余以为议论文。</p>
        <p>然前无先例，后无相随，而古今之体异矣。余乃艰难求索，究文法，思文理，终得练习作数十篇，命之曰：“实验文本”，其中道理，今细究之，虽恐非良作，尤可存之。</p>
        <p>时少年风景，意气自恃，诗酒相洒而壮志相倾。后历六月事变，摧心苦胃，竟是逐物不能，心守不成，下笔无言，终于学医。</p>
        <p>今又检视之，盖诸卿一别，五年矣。</p>
